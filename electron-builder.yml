appId: com.nettonucci.diskheadroom
productName: Disk Headroom
copyright: Copyright © 2026 Netto Nucci
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'package.json'
extraResources:
  - from: resources
    to: resources
# GitHub Releases feed for electron-updater. Actual upload is semantic-release
# (`--publish never` on the builder) so the two do not race the same tag.
publish:
  provider: github
  owner: nettonucci
  repo: diskheadroom
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # No space: electron-builder writes the space as "-" in latest-mac.yml while
  # GitHub uploads it as ".", so electron-updater 404s on its own feed.
  artifactName: DiskHeadroom-${version}-mac.${ext}
  # Local `npm run build:mac` passes -c.mac.identity=- (ad-hoc). CI omits that
  # override and uses CSC_LINK (Developer ID Application).
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarizes when APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are set (CI).
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Disk Headroom needs access to your documents folder when you choose to scan user files for reclaimable space.
    NSDownloadsFolderUsageDescription: Disk Headroom may inspect Downloads only for size reporting if you include it in a scan.
    NSDesktopFolderUsageDescription: Disk Headroom does not scan the Desktop by default.
    NSUserNotificationsUsageDescription: Disk Headroom can show a local alert when free space on the startup disk is low. Nothing is sent over the network.
    NSUserNotificationAlertStyle: alert
    LSApplicationCategoryType: public.app-category.utilities
dmg:
  title: Disk Headroom
npmRebuild: false
