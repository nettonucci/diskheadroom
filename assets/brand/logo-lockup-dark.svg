<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-labelledby="title desc">
  <title id="title">Disk Headroom logo (for dark backgrounds)</title>
  <desc id="desc">Icon mark plus wordmark, light text, transparent ground. Use on dark or near-black surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93AE8F"/>
      <stop offset="100%" stop-color="#4C6449"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,10) scale(1.4)">
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
    <path d="M50,14 L68,34 L57,34 L57,52 L43,52 L43,34 L32,34 Z" fill="#FFFFFF"/>
    <rect x="16" y="58" width="68" height="24" rx="9" fill="#FFFFFF"/>
    <rect x="26" y="69" width="20" height="5" rx="2.5" fill="#4C6449" opacity="0.6"/>
  </g>

  <text x="182" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5" fill="#F5F5F7">Disk Headroom</text>
</svg>
